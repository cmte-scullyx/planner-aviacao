<body>
<div class="wrap" id="app"></div>
<script>
const KEY='estudos-v1';
let S={subjects:[],plan:{},logs:[],cfg:{day:120,study:45,rev:15},sched:null,cards:[],qs:[],sims:[],exam:null};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const COLORS=['#007aff','#34c759','#ff9500','#ff2d55','#af52de','#32ade6'];
const DAYS=['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
let tab=S.subjects.length?'cronograma':'materias';
const sub=id=>S.subjects.find(s=>s.id===id);
const col=s=>(s&&s.c)||'#c9d3e6';
const done=s=>s.topics.filter(t=>t.done).length;
const pct=s=>s.topics.length?Math.round(done(s)/s.topics.length*100):0;
const fmt=m=>Math.floor(m/60)+'h'+String(m%60).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const lv=p=>p>=70?['g','Ótimo']:p>=40?['y','Mediano']:['r','Ruim'];
const bar=(p,c)=>{const L=lv(p);return `<div class="pb ${L[0]}" title="Desempenho ${L[1].toLowerCase()}"><div class="bar"><i style="width:${p}%"></i></div><b>${p}%</b><span class="lb">${L[1]}</span></div>`};

const INT=[1,3,7,15,30];
const add=(s,n)=>{const d=new Date(s+'T00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
const br=s=>new Date(s+'T00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'});

function gen(){
  const t0=today(),c=S.cfg;
  const keep=(S.sched&&S.sched.d===t0)?S.sched.items.filter(i=>i.done):[];
  let left=c.day-keep.reduce((a,i)=>a+i.min,0);const items=[...keep];
  const due=[];S.subjects.forEach(s=>s.topics.forEach(t=>{if(t.done&&t.next&&t.next<=t0)due.push({s,t})}));
  due.sort((a,b)=>a.t.next.localeCompare(b.t.next));
  for(const x of due){if(left<c.rev)break;items.push({id:uid(),sid:x.s.id,tid:x.t.id,type:'rev',min:c.rev,done:false});left-=c.rev}
  const q=S.subjects.map(s=>s.topics.filter(t=>!t.done).map(t=>({s,t})));let i=0;
  while(left>=c.study&&q.some(a=>a.length)){const a=q[i%q.length];i++;if(!a.length)continue;const x=a.shift();items.push({id:uid(),sid:x.s.id,tid:x.t.id,type:'new',min:c.study,done:false});left-=c.study}
  S.sched={d:t0,items};
}

let calM=today().slice(0,7),sel=today();

const tn=i=>{const s=sub(i.sid),t=s&&s.topics.find(x=>x.id===i.tid);return t?t.t:''};

function project(end){
  const t0=today(),c=S.cfg,map={},st={};
  S.subjects.forEach(s=>s.topics.forEach(t=>{st[t.id]={done:t.done,rv:t.rv||0,next:t.next||null,sid:s.id}}));
  map[t0]=S.sched.items.filter(i=>st[i.tid]);
  S.sched.items.forEach(i=>{const x=st[i.tid];if(!x||i.done)return;if(i.type==='new'){x.done=true;x.rv=0;x.next=add(t0,INT[0])}else{x.rv++;x.next=INT[x.rv]?add(t0,INT[x.rv]):null}});
  for(let d=add(t0,1);d<=end;d=add(d,1)){
    let left=c.day;const items=[];
    const due=Object.keys(st).filter(k=>st[k].done&&st[k].next&&st[k].next<=d).sort((a,b)=>st[a].next.localeCompare(st[b].next));
    for(const k of due){if(left<c.rev)break;items.push({type:'rev',sid:st[k].sid,tid:k,min:c.rev});left-=c.rev;const x=st[k];x.rv++;x.next=INT[x.rv]?add(d,INT[x.rv]):null}
    const q=S.subjects.map(s=>Object.keys(st).filter(k=>!st[k].done&&st[k].sid===s.id));let i=0;
    while(left>=c.study&&q.some(a=>a.length)){const a=q[i%q.length];i++;if(!a.length)continue;const k=a.shift();items.push({type:'new',sid:st[k].sid,tid:k,min:c.study});left-=c.study;const x=st[k];x.done=true;x.rv=0;x.next=add(d,INT[0])}
    map[d]=items;
  }
  return map;
}

const STOP=new Set('para como mais mesmo quando onde porque assim entre sobre também então ainda pelo pela pelos pelas desse dessa deste desta essas esses estes estas aquele aquela outro outra outros outras muito muita muitos muitas apenas cada todo toda todos todas seus suas nosso nossa quais qual quem isso isto aquilo sendo sido pode podem deve devem foram será serão tinha havia depois antes durante através segundo forma maneira exemplo'.split(' '));
function genLocal(text,n){
  const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  const sents=text.split(/(?<=[.!?;])\s+(?=[\p{Lu}\d])/u).map(s=>s.trim()).filter(s=>s.length>=50&&s.length<=260);
  const freq={};(text.toLowerCase().match(/\p{L}{6,}/gu)||[]).forEach(w=>{if(!STOP.has(w))freq[w]=(freq[w]||0)+1});
  const pool=Object.keys(freq).filter(w=>freq[w]>=2);
  const defRe=/^([^,:;]{3,60}?) (é|são|consiste em|consistem em|refere-se a|referem-se a|significa|define-se como|corresponde a) (.{25,200}?)[.;]?$/;
  const bad=/^(isso|isto|ele|ela|eles|elas|que|se|o que|quando|como|este|esta|esse|essa)(\s|$)/i;
  const defs=[],rest=[];
  sents.forEach(s=>{const m=s.match(defRe);if(m&&!bad.test(m[1])&&m[1].split(' ').length<=8)defs.push({s,sub:m[1].trim(),v:m[2],d:m[3].trim()});else rest.push(s)});
  const cut=d=>d.length>110?d.slice(0,110).replace(/\s+\S*$/,'')+'…':d;
  const out=[];
  if(defs.length>=4)sh(defs).slice(0,Math.ceil(n/2)).forEach(x=>{
    const others=sh(defs.filter(y=>y!==x&&y.d!==x.d)).slice(0,3);if(others.length<3)return;
    const o=sh([cut(x.d),...others.map(y=>cut(y.d))]);if(new Set(o).size<4)return;
    out.push({q:`Segundo o material, o que ${/^(são|consistem|referem)/.test(x.v)?'são':'é'} ${x.sub}?`,o,a:o.indexOf(cut(x.d)),e:`Trecho do material: "${x.s}"`})});
  const step=Math.max(1,Math.floor(rest.length/Math.max(n-out.length,1))),usedI=new Set();
  for(const st of [step,1])for(let i=0;i<rest.length&&out.length<n;i+=st){
    if(usedI.has(i))continue;usedI.add(i);
    const s=rest[i],ws=(s.match(/\p{L}{6,}/gu)||[]).filter(w=>!STOP.has(w.toLowerCase())&&freq[w.toLowerCase()]>=2);
    if(!ws.length)continue;
    ws.sort((a,b)=>freq[b.toLowerCase()]-freq[a.toLowerCase()]||b.length-a.length);
    const lw=ws[0].toLowerCase(),re=new RegExp('(?<!\\p{L})'+lw+'(?!\\p{L})','iu'),m=s.match(re);if(!m)continue;
    const ds=sh(pool.filter(p=>p!==lw&&Math.abs(p.length-lw.length)<=3&&!s.toLowerCase().includes(p))).slice(0,3);if(ds.length<3)continue;
    const cap=/^\p{Lu}/u.test(m[0])&&m.index>0,f=x=>cap?x[0].toUpperCase()+x.slice(1):x,ans=cap?m[0]:lw,o=sh([ans,...ds.map(f)]);
    out.push({q:'Complete a frase do material: "'+s.replace(re,'_____')+'"',o,a:o.indexOf(ans),e:'Trecho do material: "'+s+'"'})}
  return sh(out).slice(0,n);
}
async function genQs(sid,file,txt,n){
  if(simBusy)return;
  if(!sid){simMsg='Escolha uma matéria.';paint();return}
  if(!file&&txt.trim().length<200){simMsg='Envie um PDF ou cole o texto da aula (mínimo de 200 caracteres).';paint();return}
  simBusy=true;simUI(true);simMsg='Preparando…';paint();let ok=false;
  try{
    let t=(file?await pdfText(file):'')+'\n'+txt;t=t.replace(/\s+/g,' ').trim();
    if(t.length<200)throw{code:'vazio'};
    const cut=t.length>90000;t=t.slice(0,90000);
    const sample={json:async()=>genLocal(t,n)};
    if(!sample)throw{code:'nosample'};
    simMsg='Montando '+n+' questões a partir do texto…';paint();
    simCtl=new AbortController();
    const prompt=`Você é um professor elaborando um banco de questões. Com base SOMENTE no conteúdo da aula abaixo, crie ${n} questões de múltipla escolha, em português do Brasil, com 4 alternativas cada e exatamente uma correta. Varie o nível (memorização, compreensão e aplicação), evite pegadinhas, não repita questões e varie a posição da alternativa correta.\nResponda SOMENTE com um array JSON, sem nenhum texto fora dele, neste formato:\n[{"q":"enunciado","o":["alternativa A","alternativa B","alternativa C","alternativa D"],"a":0,"e":"explicação curta da resposta correta"}]\nO campo "a" é o índice (0 a 3) da alternativa correta.\n\nCONTEÚDO DA AULA:\n${t}`;
    const r=await sample.json(prompt,{signal:simCtl.signal});
    const arr=(Array.isArray(r)?r:(r&&Object.values(r).find(Array.isArray))||[]).filter(x=>x&&typeof x.q==='string'&&Array.isArray(x.o)&&x.o.length===4&&x.o.every(o=>typeof o==='string')&&Number.isInteger(x.a)&&x.a>=0&&x.a<4);
    const have=new Set(S.qs.map(x=>x.q.toLowerCase()));let add=0;
    arr.forEach(x=>{if(have.has(x.q.toLowerCase()))return;S.qs.push({id:uid(),sid,q:x.q.trim(),o:x.o.map(s=>s.trim()),a:x.a,e:String(x.e||'').trim(),src:file?file.name:'texto colado',d:today()});add++});
    save();ok=add>0;
    simMsg=add?add+' questões salvas no banco.'+(cut?' O material era muito longo: usei só o início.':''):'Não consegui montar questões com esse texto. Use um material mais longo, com frases completas.';
  }catch(e){
    const m={not_granted:'Você precisa permitir o uso do Claude para gerar questões.',cancelled:'Geração cancelada.',rate_limited:'Muitas chamadas ou limite de uso atingido. Tente mais tarde.',invalid_json:'A IA respondeu em formato inesperado. Tente de novo.',vazio:'Não encontrei texto no PDF. PDFs escaneados (só imagem) não funcionam: cole o texto da aula.',nosample:'A IA não está disponível nesta página.',sampling_disabled:'O Claude não está disponível nesta conta.'};
    simMsg=(e&&m[e.code])||'Não consegui gerar as questões (verifique o PDF e tente de novo).';
  }

}
function mkExam(sid,n){
  const pool=S.qs.filter(q=>sub(q.sid)&&(!sid||q.sid===sid));if(!pool.length)return;
  const sh=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
  S.exam={id:uid(),d:today(),sid,done:false,items:sh(pool).slice(0,Math.min(n,pool.length)).map(q=>({qid:q.id,o:sh([0,1,2,3]),pick:null}))};
}
function finExam(){
  const E=S.exam;if(!E||E.done)return;const per={};let tot=0,ok=0;
  E.items.forEach(it=>{const q=S.qs.find(x=>x.id===it.qid);if(!q)return;tot++;const c=it.pick!==null&&it.o[it.pick]===q.a;if(c)ok++;const p=per[q.sid]=per[q.sid]||{q:0,ok:0};p.q++;if(c)p.ok++});
  E.done=true;E.ok=ok;E.tot=tot;S.sims.push({id:E.id,d:E.d,sid:E.sid,n:tot,ok});
  Object.keys(per).forEach(sid=>S.logs.push({id:uid(),sid,d:today(),min:0,q:per[sid].q,ok:per[sid].ok}));
}
function vExam(){
  const E=S.exam;if(!E)return'';
  const its=E.items.map((it,i)=>({it,i,q:S.qs.find(x=>x.id===it.qid)})).filter(x=>x.q),L='ABCD',ans=its.filter(x=>x.it.pick!==null).length;
  const body=its.map((x,j)=>{const right=x.it.o.indexOf(x.q.a);
    return `<div class="qb"><p class="qt">${j+1}. ${esc(x.q.q)}</p>${x.it.o.map((oi,k)=>`<label class="op ${E.done?(k===right?'ok':k===x.it.pick?'bad':''):''}"><input type="radio" name="q${x.i}" data-a="pk" data-i="${x.i}" data-k="${k}" ${x.it.pick===k?'checked':''} ${E.done?'disabled':''}><span>${L[k]}) ${esc(x.q.o[oi])}</span></label>`).join('')}${E.done&&x.q.e?`<p class="note">${esc(x.q.e)}</p>`:''}</div>`}).join('');
  const tot=E.done?E.tot:its.length;
  return `<section class="panel" style="margin-top:16px"><h3>Simulado</h3>${E.done?`<p class="res">${E.ok} de ${tot} acertos (${tot?Math.round(E.ok/tot*100):0}%)</p>`:`<small style="color:var(--mut)">${ans} de ${its.length} respondidas</small>`}${body}
  ${E.done?'<button class="big" data-a="simnew">Fechar simulado</button>':'<button class="big" data-a="simfin">Finalizar simulado</button>'}</section>`;
}

function vCron(){
  const t0=today(),c=S.cfg;
  if(!S.sched||S.sched.d!==t0||!S.sched.items.length){gen();save()}
  const its=S.sched.items.filter(i=>{const s=sub(i.sid);return s&&s.topics.some(x=>x.id===i.tid)});
  const tot=its.reduce((a,i)=>a+i.min,0),dm=its.filter(i=>i.done).reduce((a,i)=>a+i.min,0),p=tot?Math.round(dm/tot*100):0;
  let due=0,newLeft=0;const fut=[];
  S.subjects.forEach(s=>s.topics.forEach(t=>{if(!t.done)newLeft++;else if(t.next){if(t.next<=t0)due++;else fut.push({s,t})}}));
  fut.sort((a,b)=>a.t.next.localeCompare(b.t.next));
  const pend=due-its.filter(i=>i.type==='rev'&&!i.done).length;
  const pace=its.filter(i=>i.type==='new').length;
  const list=its.map(i=>{const s=sub(i.sid),t=s.topics.find(x=>x.id===i.tid);
    return `<li style="--c:${col(s)}"><label><input type="checkbox" data-a="ci" data-id="${i.id}" ${i.done?'checked':''}><span class="${i.done?'d':''}"><span class="tg ${i.type==='new'?'n':'r'}">${i.type==='new'?'Estudar':'Revisar'}</span>${esc(t.t)}<em>${esc(s.name)} · ${i.min} min${i.type==='rev'?' · revisão '+((t.rv||0)+(i.done?0:1))+' de '+INT.length:''}</em></span></label></li>`}).join('');
  const empty=S.subjects.some(s=>s.topics.length)?'Nada planejado para hoje. Aumente o tempo diário ou adicione tópicos.':'Cadastre matérias e tópicos na aba Matérias: o cronograma é montado sozinho a partir deles.';
  return `<div class="two"><section class="panel cr"><h3>Hoje, ${br(t0)}</h3>${bar(p,'#7fe0b5')}<small style="color:var(--mut)">${fmt(dm)} de ${fmt(tot)} planejados</small>
  ${list?`<ul>${list}</ul>`:`<p class="empty" style="margin-top:10px">${empty}</p>`}
  ${pend>0?`<div class="warn">${pend} revisão(ões) não coube(ram) hoje. Aumente o tempo diário para colocá-las em dia.</div>`:''}
  <button class="ghost" data-a="regen">Refazer cronograma de hoje</button><p class="note">Ao marcar um item como feito, ele conta no avanço da matéria, entra no Desempenho e agenda a próxima revisão.</p></section>
  <div><section class="panel"><h3>Tempo de cada bloco</h3><form class="logform" data-f="cfg" style="margin-top:10px">
  <label class="w">Tempo disponível por dia (min)<input type="number" name="day" min="10" max="1440" value="${c.day}" required></label>
  <label>Estudo novo (min)<input type="number" name="study" min="5" max="480" value="${c.study}" required></label>
  <label>Revisão (min)<input type="number" name="rev" min="5" max="240" value="${c.rev}" required></label>
  <button>Salvar e refazer cronograma</button></form>
  <p class="note">Revisões automáticas: 1, 3, 7, 15 e 30 dias depois de estudar cada tópico. Revisões atrasadas têm prioridade; o resto do tempo vai para tópicos novos, alternando entre as matérias.${pace&&newLeft?` No ritmo de hoje (${pace} tópico(s) novo(s) por dia), faltam cerca de ${Math.ceil(newLeft/pace)} dia(s) para ver todos os tópicos.`:''}</p></section>
  <section class="panel" style="margin-top:16px"><h3>Próximas revisões</h3>${fut.length?`<ul>${fut.slice(0,12).map(x=>`<li><div class="hl"><div><strong>${esc(x.t.t)}</strong><em>${esc(x.s.name)}</em></div><span>${br(x.t.next)}</span></div></li>`).join('')}</ul>`:'<p class="empty" style="margin-top:10px">Nenhuma revisão agendada ainda. Ao concluir um tópico, a primeira revisão aparece aqui.</p>'}</section></div></div>`;
}

document.addEventListener('click',e=>{
  const b=e.target.closest('[data-a]');if(!b)return;
  const a=b.dataset.a,id=b.dataset.id,d=b.dataset.d,s=sub(id);
  if(a==='tab')tab=b.dataset.v;
  else if(a==='delsub'){if(!confirm('Remover esta matéria e todos os seus tópicos?'))return;S.subjects=S.subjects.filter(x=>x.id!==id)}
  else if(a==='tt'){const t=s.topics.find(x=>x.id===b.dataset.t);t.done=!t.done;t.rv=0;t.next=t.done?add(today(),INT[0]):null}
  else if(a==='ci'){const it=S.sched.items.find(x=>x.id===id),sb=it&&sub(it.sid),t=sb&&sb.topics.find(x=>x.id===it.tid);if(t){const t0=today();
    if(!it.done){it.prev={done:t.done,rv:t.rv||0,next:t.next||null};
      if(it.type==='new'){t.done=true;t.rv=0;t.next=add(t0,INT[0])}else{t.rv=(t.rv||0)+1;t.next=INT[t.rv]?add(t0,INT[t.rv]):null}
      it.lid=uid();S.logs.push({id:it.lid,sid:it.sid,d:t0,min:it.min,q:0,ok:0});it.done=true}
    else{Object.assign(t,it.prev);S.logs=S.logs.filter(x=>x.id!==it.lid);it.done=false}}}
  else if(a==='regen')gen();
  else if(a==='tmstart'){const ss=document.getElementById('tsid'),tm=document.getElementById('tmin');if(!ss||!ss.value)return;
    S.timer={sid:ss.value,start:Date.now(),target:Math.max(0,Math.floor(+tm.value||0)),fired:false};tmAlert=false;
    try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}
    try{if(window.Notification&&Notification.permission==='default')Notification.requestPermission()}catch(e){}}
  else if(a==='tmend'){const T=S.timer;if(T){const sec=(Date.now()-T.start)/1000;if(sec>=30&&sub(T.sid))S.logs.push({id:uid(),sid:T.sid,d:today(),min:Math.max(1,Math.round(sec/60)),q:0,ok:0})}S.timer=null;tmAlert=false;document.title='Meus estudos'}
  else if(a==='tmcancel'){S.timer=null;tmAlert=false;document.title='Meus estudos'}
  else if(a==='tmok'){tmAlert=false;document.title='Meus estudos'}
  else if(a==='simgen'){const g=x=>document.getElementById(x);if(!g('simf'))return;genQs(g('sims').value,g('simf').files[0]||null,g('simt').value,+g('simn').value||10);return}
  else if(a==='simstop'){if(simCtl)simCtl.abort();return}
  else if(a==='simmk')mkExam(document.getElementById('msid').value,Math.max(1,Math.floor(+document.getElementById('mnum').value||10)));
  else if(a==='pk')S.exam.items[+b.dataset.i].pick=+b.dataset.k;
  else if(a==='simfin')finExam();
  else if(a==='simnew')S.exam=null;
  else if(a==='delq')S.qs=S.qs.filter(x=>x.id!==id);
  else if(a==='fshow')fshow=true;
  else if(a==='ff'){fsel=b.dataset.v;fshow=false}
  else if(a==='frate'){const cd=S.cards.find(x=>x.id===id);if(cd){cd.lv=b.dataset.l;cd.n=(cd.n||0)+1;S.fcCount=(S.fcCount||0)+1;S.fcDays=S.fcDays||{};S.fcDays[today()]=(S.fcDays[today()]||0)+1;cd.next=add(today(),LV[cd.lv].d)}fshow=false}
  else if(a==='delcard')S.cards=S.cards.filter(x=>x.id!==id);
  else if(a==='sel'){sel=b.dataset.v;calM=sel.slice(0,7)}
  else if(a==='mon'){const v=+b.dataset.v;if(!v){calM=today().slice(0,7);sel=today()}else{const [yy,mm]=calM.split('-').map(Number),dt=new Date(yy,mm-1+v,1);calM=dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')}}
  else if(a==='deltop')s.topics=s.topics.filter(x=>x.id!==b.dataset.t);
  else if(a==='pt'){const t=S.plan[d].find(x=>x.id===id);t.done=!t.done}
  else if(a==='delpt')S.plan[d]=S.plan[d].filter(x=>x.id!==id);
  else if(a==='clrweek')for(const k in S.plan)S.plan[k]=S.plan[k].filter(x=>!x.done);
  else if(a==='dellog')S.logs=S.logs.filter(x=>x.id!==id);
  save();render();
});

  e.preventDefault();const f=e.target,k=f.dataset.f,v=n=>f.elements[n]?f.elements[n].value.trim():'';
  if(k==='cfg'){S.cfg={day:Math.max(10,+v('day')||120),study:Math.max(5,+v('study')||45),rev:Math.max(5,+v('rev')||15)};gen()}
  else if(k==='card'){S.cards.push({id:uid(),sid:v('s'),q:v('q'),a:v('a'),next:null,lv:null,n:0});fsel=v('s');fshow=false}
  else if(k==='sub')S.subjects.push({id:uid(),name:v('n'),c:COLORS[S.subjects.length%COLORS.length],topics:[]});
  else if(k==='top')sub(f.dataset.id).topics.push({id:uid(),t:v('n'),done:false});
  else if(k==='plan'){const d=f.dataset.d;(S.plan[d]=S.plan[d]||[]).push({id:uid(),t:v('n'),sid:v('s'),done:false})}
  else if(k==='log'){const m=+v('m'),q=Math.max(0,+v('q')||0);let o=Math.max(0,+v('o')||0);if(o>q)o=q;
    S.logs.push({id:uid(),sid:v('s'),d:v('d'),min:m,q:q,ok:o})}
  save();render();
});
render();
</script>
</body>
</html>
